services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: pcm
      POSTGRES_USER: pcm
      # Port database tidak dipublikasikan ke host; hanya service "web" yang bisa menjangkaunya,
      # jadi tidak perlu password tersimpan di repo.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcm -d pcm"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # .env bersifat opsional (mis. untuk SECRET_KEY tetap atau kunci object storage).
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: "False"
      DATABASE_URL: postgres://pcm@db:5432/pcm
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      # Akses lokal lewat http: cookie tidak boleh ditandai "secure".
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    # Tanpa SECRET_KEY di .env, dibuat acak saat container start (tidak ada rahasia di repo).
    command:
      - sh
      - -c
      - |
        export SECRET_KEY="$${SECRET_KEY:-$$(python -c 'import secrets; print(secrets.token_urlsafe(50))')}"
        python manage.py migrate --noinput
        exec gunicorn config.wsgi:application --bind 0.0.0.0:$${PORT:-8000} --workers 2

volumes:
  postgres_data:
  media_data:
